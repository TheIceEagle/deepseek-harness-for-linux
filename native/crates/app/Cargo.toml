[package]
name = "harness-native-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native Rust desktop client for DeepSeek-compatible models"

[[bin]]
name = "deepseek-harness-native"
path = "src/main.rs"

[dependencies]
harness-native-core = { path = "../core" }
harness-native-plugins = { path = "../plugins" }
gtk = { package = "gtk4", version = "=0.11.5", features = ["v4_12"] }
pulldown-cmark = { version = "=0.13.6", default-features = false }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "sync", "time"] }
tokio-util = "=0.7.18"
