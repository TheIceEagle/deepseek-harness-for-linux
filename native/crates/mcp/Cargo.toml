[package]
name = "harness-native-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
libc = "=0.2.191"
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-async-rw"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "process", "sync", "time", "io-util"] }
tokio-util = { version = "=0.7.18", features = ["rt"] }

[dev-dependencies]
tempfile = "=3.27.0"
