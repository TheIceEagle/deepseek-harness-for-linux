[package]
name = "harness-native-plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
libc = "0.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmi = { version = "=2.0.0", default-features = false, features = ["std", "validate", "portable-dispatch", "deterministic"] }

[dev-dependencies]
tempfile = "3"
wat = "1"
