[workspace]
members = ["crates/core", "crates/plugins", "crates/mcp", "crates/app"]
default-members = ["crates/app"]
resolver = "2"

[workspace.package]
version = "0.2.0-alpha.2"
edition = "2021"
rust-version = "1.93.1"
license = "MIT"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 8
