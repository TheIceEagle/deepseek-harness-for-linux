name: Set up Linux
description: Install the pinned build and native desktop test tools.
inputs:
  ubuntu:
    description: Ubuntu version used to isolate native build caches.
    required: true
  install-runtime:
    description: Install and prepare the pinned upstream runtime.
    default: "true"
runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        webdriver=webkit2gtk-driver
        if apt-cache show webkitgtk-webdriver >/dev/null 2>&1; then
          webdriver=webkitgtk-webdriver
        fi
        sudo apt-get install --yes --no-install-recommends \
          build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev libxdo-dev \
          libayatana-appindicator3-dev librsvg2-dev curl wget file \
          xvfb "$webdriver" dbus-daemon xdg-utils xdg-user-dirs \
          python3-gi gir1.2-gtk-3.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "26.10.0"
        cache: npm
        cache-dependency-path: |
          package-lock.json
          runtime/package-lock.json
    - name: Pin npm and its install-script policy
      shell: bash
      run: npm install --global npm@12.1.0
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: "1.93.1"
        components: rustfmt, clippy
    - name: Cache Cargo dependencies and build output
      if: inputs.install-runtime == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          src-tauri/target
          !src-tauri/target/release/bundle
        key: cargo-${{ inputs.ubuntu }}-${{ runner.arch }}-1.93.1-${{ hashFiles('src-tauri/Cargo.lock') }}
        restore-keys: cargo-${{ inputs.ubuntu }}-${{ runner.arch }}-1.93.1-
    - name: Cache the native desktop test driver
      id: driver-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/bin/tauri-driver
        key: tauri-driver-${{ inputs.ubuntu }}-${{ runner.arch }}-2.1.0-rust1.93.1
    - name: Install the native desktop test driver
      if: steps.driver-cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install tauri-driver --version 2.1.0 --locked
    - name: Install shell dependencies
      shell: bash
      run: npm ci
    - name: Install and prepare the upstream runtime
      if: inputs.install-runtime == 'true'
      shell: bash
      run: |
        npm ci --prefix runtime
        npm run prepare:runtime
    - name: Record the test environment
      shell: bash
      run: |
        {
          printf '### Build and test environment\n\n'
          printf '| Component | Version |\n| --- | --- |\n'
          printf '| OS | %s |\n' "$(lsb_release --description --short)"
          printf '| Node | %s |\n' "$(node --version)"
          printf '| npm | %s |\n' "$(npm --version)"
          printf '| Rust | %s |\n' "$(rustc --version)"
          printf '| WebKitGTK 4.1 | %s |\n' "$(pkg-config --modversion webkit2gtk-4.1)"
        } >> "$GITHUB_STEP_SUMMARY"
