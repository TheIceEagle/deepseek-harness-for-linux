name: Native Rust
on:
  push:
    branches: ["**"]
    paths:
      - "native/**"
      - "LICENSE"
      - "src-tauri/icons/icon.png"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "native/**"
      - "LICENSE"
      - "src-tauri/icons/icon.png"
      - ".github/workflows/native.yml"
permissions:
  contents: read
concurrency:
  group: native-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  check:
    name: Native source and desktop (Ubuntu ${{ matrix.ubuntu }})
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native build and desktop test libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential pkg-config libgtk-4-dev dpkg-dev \
            xvfb dbus-x11 fonts-ubuntu python3-gi gir1.2-gtk-4.0 \
            python3-pyatspi at-spi2-core python3-pil xdotool tesseract-ocr tesseract-ocr-eng
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.93.1"
          components: rustfmt, clippy
      - name: Cache native Cargo dependencies and output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: native-${{ matrix.ubuntu }}-${{ runner.arch }}-rust1.93.1-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: native-${{ matrix.ubuntu }}-${{ runner.arch }}-rust1.93.1-
      - name: Check formatting
        run: cargo fmt --manifest-path native/Cargo.toml --all -- --check
      - name: Check Clippy
        run: cargo clippy --manifest-path native/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Run native Rust tests
        run: cargo test --manifest-path native/Cargo.toml --workspace --locked
      - name: Build the native desktop application
        run: cargo build --manifest-path native/Cargo.toml --locked -p harness-native-app
      - name: Build the harmless example plugin
        run: cargo run --manifest-path native/Cargo.toml --locked -p harness-native-plugins --example build-plugin
      - name: Check native desktop workflows
        env:
          HARNESS_NATIVE_PLUGIN_FIXTURE: native/examples/uppercase
        run: python3 native/tests/smoke-native.py native/target/debug/deepseek-harness-native
      - name: Build one baseline Debian installer and checksums
        if: matrix.ubuntu == '24.04'
        run: bash native/scripts/build-native-deb.sh
      - name: Retain the baseline installer
        if: matrix.ubuntu == '24.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-deb-${{ github.sha }}
          path: |
            native/dist/*.deb
            native/dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Retain native desktop reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-source-reports-ubuntu-${{ matrix.ubuntu }}
          path: artifacts/native-*
          if-no-files-found: ignore
          retention-days: 7
  installed:
    name: Native installed package (Ubuntu ${{ matrix.ubuntu }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native desktop test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            xvfb dbus-x11 fonts-ubuntu python3-gi gir1.2-gtk-4.0 \
            python3-pyatspi at-spi2-core python3-pil xdotool tesseract-ocr tesseract-ocr-eng
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-deb-${{ github.sha }}
          path: native/dist
      - name: Verify and install the baseline package
        run: |
          cd native/dist
          sha256sum --check SHA256SUMS
          sudo apt-get install --yes --no-install-recommends ./*.deb
          test -s /usr/share/doc/deepseek-harness-native/copyright
          test -s /usr/share/doc/deepseek-harness-native/third-party-licenses/index.json
          test -s /usr/share/applications/io.github.theiceeagle.DeepSeekHarnessNative.desktop
      - name: Check installed native desktop workflows
        env:
          HARNESS_NATIVE_PLUGIN_FIXTURE: /usr/share/deepseek-harness-native/examples/uppercase
        run: python3 native/tests/smoke-native.py /usr/bin/deepseek-harness-native
      - name: Retain installed native reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-installed-reports-ubuntu-${{ matrix.ubuntu }}
          path: artifacts/native-*
          if-no-files-found: ignore
          retention-days: 7
