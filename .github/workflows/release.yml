name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify the tagged source and installer
    uses: ./.github/workflows/ci.yml
  publish:
    name: Publish the verified installer
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-deb-${{ github.sha }}
          path: release
      - name: Verify the tag and publish its tested files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          cd release
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --generate-notes -- *.deb SHA256SUMS
